[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2agent-skill"
version = "0.1.0"
description = "Resource-first paper analysis and MCP packaging for coding agents"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
mcp = ["fastmcp>=2.0"]
dev = ["pytest>=8.0", "jsonschema>=4.0"]

[project.scripts]
paper2agent = "paper2agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
